[package]
name = "screenpipe-apple-intelligence"
version = "0.1.0"
edition = "2021"
description = "On-device AI processing using Apple Foundation Models framework (macOS 26+)"
license = "MIT"

[features]
default = []
screenpipe-query = ["dep:reqwest", "dep:tokio"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"], optional = true }
chrono = "0.4"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json"] }
chrono = "0.4"

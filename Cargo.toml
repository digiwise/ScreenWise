[workspace]
members = [
    "crates/*",
]
default-members = [
    "crates/screenpipe-a11y",
    "crates/screenpipe-apple-intelligence",
    "crates/screenpipe-audio",
    "crates/screenpipe-capture",
    "crates/screenpipe-config",
    "crates/screenpipe-connect",
    "crates/screenpipe-core",
    "crates/screenpipe-db",
    "crates/screenpipe-engine",
    "crates/screenpipe-events",
    "crates/screenpipe-redact",
    "crates/screenpipe-screen",
    "crates/screenpipe-secrets",
    "crates/screenpipe-vault",
]
exclude = [
    "apps/screenpipe-app-tauri/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.4.15"
authors = ["louis030195 <hi@louis030195.com>"]
description = ""
repository = "https://github.com/screenpipe/screenpipe"
license = "MIT OR Apache-2.0"
edition = "2021"

[workspace.dependencies]
# AI
hf-hub = { version = "0.3.2", git = "https://github.com/neo773/hf-hub", rev = "437dcf4049233f4a0e0cfc4e1c1dbf5ed2c57760", default-features = false, features = [
    "native-tls",
    "tokio",
    "ureq",
] }
log = "0.4"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "chrono"] }
tracing-appender = { version = "0.2.3" }
tokio = { version = "1.15", features = ["full", "tracing"] }
crossbeam = "0.8.4"
dashmap = "6.1.0"
image = "0.25"
criterion = { version = "0.5.1", features = ["async_tokio"] }
oasgen = { version = "0.22.0", features = ["axum", "chrono"] }
once_cell = "1.20.2"
tracing-oslog = "0.3.0"

# reqwest 0.13 renamed `rustls-tls` → `rustls` and folded the native-roots
# variants into `rustls-platform-verifier` (which the `rustls` feature pulls
# in automatically). The `rustls` feature bundles aws-lc-rs as the provider;
# Windows MSVC links cleanly because of bswap_shim.c in the tauri app crate.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "multipart", "json", "form", "query", "rustls"] }


[patch.crates-io]
# enables chinese mirror (hf is banned in china) and rustls-tls
hf-hub = { git = "https://github.com/neo773/hf-hub", rev = "437dcf4049233f4a0e0cfc4e1c1dbf5ed2c57760" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Fast functional builds through scripts/windows/build/Invoke-ScreenWiseBuild.ps1.
# Keep full release for production artifacts and performance measurements.
[profile.release-local]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
opt-level = 1
debug = false

# Faster dev builds - optimize dependencies but keep local code debuggable
[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 2      # Optimize all dependencies (faster runtime, same compile time)
debug = false      # deps don't need debug symbols — keeps target/ from ballooning

# knf-rs-sys chooses its native CMake profile from the build script's debug
# assertions. Keep it on the release CRT to match whisper-rs-sys in dev tests.
[profile.dev.package.knf-rs-sys]
debug-assertions = false
